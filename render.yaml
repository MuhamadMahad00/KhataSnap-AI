# Render Blueprint deployment file for KhataSnap AI
services:
  # Backend API Service
  - type: web
    name: khatasnap-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY_VISION
        sync: false
      - key: GROQ_API_KEY_CHAT
        sync: false
      - key: GROQ_API_KEY_INSIGHTS
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b

  # Frontend Web Service
  - type: static
    name: khatasnap-ai-web
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
